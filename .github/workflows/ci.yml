name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.113
      - name: Restore
        run: dotnet restore Radix.slnx
      - name: Build Release
        run: dotnet build Radix.slnx -c Release --no-restore
      - name: Core tests
        run: dotnet test tests/Radix.Core.Tests/Radix.Core.Tests.csproj -c Release --no-build
      - name: Headless Editor tests
        run: dotnet test tests/Radix.Editor.Tests/Radix.Editor.Tests.csproj -c Release --no-build
      - name: Validate every example and definition
        shell: pwsh
        run: |
          Get-ChildItem examples -Filter '*.radix' | ForEach-Object {
            Write-Host "Validating $($_.Name)"
            dotnet run -c Release --no-build --project src/Radix.Cli -- validate $_.FullName --all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
