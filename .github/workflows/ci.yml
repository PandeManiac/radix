name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: .NET 10 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install headless rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore Radix.slnx

      - name: Build Release
        run: dotnet build Radix.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Radix.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Validate examples
        shell: bash
        run: |
          for project in examples/*.radix; do
            echo "Validating $project"
            dotnet run --configuration Release --no-build --project src/Radix.Cli -- validate "$project" --all
          done

      - name: Run example simulation scripts
        shell: bash
        run: >-
          dotnet run --configuration Release --no-build --project src/Radix.Cli --
          test examples/binary-counter.radix examples/tests/counter-counts.radixtest
