
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install headless rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1 libfreetype6

      - name: Restore
        run: dotnet restore Radix.slnx

      - name: Build Release
        run: dotnet build Radix.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Radix.slnx -c Release --no-build

      - name: Validate examples
        shell: pwsh
        run: |
          Get-ChildItem examples -Filter '*.radix' | ForEach-Object {
            Write-Host "Validating $($_.Name)"
            dotnet run -c Release --no-build --project src/Radix.Cli -- validate $_.FullName --all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run example simulation scripts
        shell: bash
        run: >-
          dotnet run -c Release --no-build --project src/Radix.Cli --
          test examples/binary-counter.radix examples/tests/counter-counts.radixtest

